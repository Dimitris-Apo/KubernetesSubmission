<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 32rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    h2 { margin-bottom: 0.5rem; }
    .subtitle { opacity: 0.7; margin-top: 0; }
    img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin-top: 1.5rem;
    }
    .todos {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(127, 127, 127, 0.3);
    }
    #todo-form {
      display: flex;
      gap: 0.5rem;
    }
    #todo-input {
      flex: 1;
      font: inherit;
      padding: 0.5rem 0.6rem;
      border: 1px solid rgba(127, 127, 127, 0.5);
      border-radius: 0.4rem;
      background: canvas;
      color: canvastext;
    }
    #todo-form button {
      font: inherit;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(127, 127, 127, 0.5);
      border-radius: 0.4rem;
      background: rgba(127, 127, 127, 0.15);
      cursor: pointer;
    }
    #todo-form button:hover:not(:disabled) { background: rgba(127, 127, 127, 0.3); }
    #todo-form button:disabled { opacity: 0.5; cursor: default; }
    .char-count {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      opacity: 0.6;
    }
    .char-count.over-limit { color: #d33; opacity: 1; }
    #todo-error {
      margin: 0.6rem 0 0;
      font-size: 0.85rem;
      color: #d33;
    }
    #todo-list {
      padding-left: 1.25rem;
      margin-top: 1.25rem;
    }
    #todo-list li { margin: 0.4rem 0; }
  </style>
</head>
<body>
  <h1>&#9989; Todo App</h1>
  <p class="subtitle">Server is up and responding to GET /.</p>
  <p>Todos are now backed by the todo-backend service &mdash; nothing is hardcoded below.</p>
  <img src="/image" alt="A random picture from Lorem Picsum" />

  <section class="todos">
    <h2>Todos</h2>
    <form id="todo-form">
      <input
        id="todo-input"
        type="text"
        maxlength="140"
        placeholder="What needs doing?"
        required
        autocomplete="off"
      />
      <button type="submit">Send</button>
    </form>
    <p class="char-count"><span id="char-count">0</span>/140</p>
    <p id="todo-error" hidden></p>

    <ul id="todo-list"></ul>
  </section>

  <script>
    const MAX_LENGTH = 140;
    const TODOS_URL = '/todos'; // same-origin, routed to todo-backend by the Ingress
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const sendButton = form.querySelector('button');
    const list = document.getElementById('todo-list');
    const charCount = document.getElementById('char-count');
    const errorEl = document.getElementById('todo-error');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
    }

    function clearError() {
      errorEl.hidden = true;
    }

    function renderTodo(todo) {
      const li = document.createElement('li');
      li.textContent = todo.text;
      li.dataset.id = todo.id;
      list.appendChild(li);
    }

    async function loadTodos() {
      try {
        const response = await fetch(TODOS_URL);
        if (!response.ok) {
          throw new Error(`GET /todos returned ${response.status}`);
        }
        const todos = await response.json();
        list.innerHTML = '';
        todos.forEach(renderTodo);
      } catch (err) {
        showError("Couldn't load todos - todo-backend may be unreachable.");
      }
    }

    input.addEventListener('input', () => {
      const length = input.value.length;
      charCount.textContent = length;
      charCount.classList.toggle('over-limit', length > MAX_LENGTH);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const text = input.value.trim();
      if (!text || text.length > MAX_LENGTH) {
        return;
      }

      sendButton.disabled = true;
      try {
        const response = await fetch(TODOS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });

        if (!response.ok) {
          throw new Error(`POST /todos returned ${response.status}`);
        }

        const created = await response.json();
        renderTodo(created);

        input.value = '';
        charCount.textContent = '0';
      } catch (err) {
        showError("Couldn't save that todo - todo-backend may be unreachable.");
      } finally {
        sendButton.disabled = false;
      }
    });

    loadTodos();
  </script>
</body>
</html>
