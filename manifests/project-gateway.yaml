apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: project-gateway
  namespace: project
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: project-route
  namespace: project
spec:
  parentRefs:
  - name: project-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /todos
    backendRefs:
    - name: todo-backend-svc
      port: 2345
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: todoapp-svc
      port: 2345
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: todo-backend-hc
  namespace: project
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /todos
  targetRef:
    group: ""
    kind: Service
    name: todo-backend-svc